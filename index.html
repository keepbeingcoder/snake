<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3f6f1; --board: #dfe8d8; --snake: #2f6b3a; --food: #d6452f; --text: #1f2a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a15; --board: #1f281f; --snake: #7bd389; --food: #ff6b57; --text: #e6efe6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a15; --board: #1f281f; --snake: #7bd389; --food: #ff6b57; --text: #e6efe6;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  canvas { background: var(--board); border-radius: 8px; max-width: 92vw; touch-action: none; }
  p { margin: 0; }
</style>
</head>
<body>
  <p id="score">Score: 0</p>
  <canvas id="game" width="400" height="400"></canvas>
  <p>Arrow keys / WASD or swipe. Press Space to restart.</p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const size = 20, cells = canvas.width / size;
  let snake, dir, nextDir, food, score, timer;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n);

  function start() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = nextDir = { x: 1, y: 0 };
    score = 0;
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 120);
    document.getElementById("score").textContent = "Score: 0";
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells;
    if (hitWall || snake.some(s => s.x === head.x && s.y === head.y)) {
      clearInterval(timer);
      document.getElementById("score").textContent = "Game over! Score: " + score + " (Space to restart)";
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById("score").textContent = "Score: " + score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = css("--food");
    ctx.fillRect(food.x * size, food.y * size, size - 2, size - 2);
    ctx.fillStyle = css("--snake");
    snake.forEach(s => ctx.fillRect(s.x * size, s.y * size, size - 2, size - 2));
  }

  function turn(x, y) {
    if (x !== -dir.x || y !== -dir.y) nextDir = { x, y };
  }

  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") turn(0, -1);
    else if (k === "arrowdown" || k === "s") turn(0, 1);
    else if (k === "arrowleft" || k === "a") turn(-1, 0);
    else if (k === "arrowright" || k === "d") turn(1, 0);
    else if (k === " ") start();
    if (k.startsWith("arrow") || k === " ") e.preventDefault();
  });

  let sx, sy;
  canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  canvas.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  start();
  draw();
</script>
</body>
</html>
