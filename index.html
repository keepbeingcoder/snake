<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --page: #e4e7ee; --shell: #3d4a7a; --shell-dark: #2c3659; --btn: #5566a0; --btn-text: #fff;
    --lcd: #b9cba3; --lcd-grid: #aabf92; --snake: #243322; --food: #8a2b1c; --lcd-text: #243322;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0e1016; --shell: #2a3156; --shell-dark: #1b2040; --btn: #3f4b82;
      --lcd: #1b261c; --lcd-grid: #223024; --snake: #8be08b; --food: #ff7a66; --lcd-text: #8be08b;
    }
  }
  :root[data-theme="dark"] {
    --page: #0e1016; --shell: #2a3156; --shell-dark: #1b2040; --btn: #3f4b82;
    --lcd: #1b261c; --lcd-grid: #223024; --snake: #8be08b; --food: #ff7a66; --lcd-text: #8be08b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100%; background: var(--page);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .console {
    width: 100%; max-width: 420px; background: var(--shell); border-radius: 28px 28px 60px 28px;
    padding: 18px 18px 26px; box-shadow: 0 10px 0 var(--shell-dark), 0 22px 30px rgba(0,0,0,.25);
  }
  .bar {
    display: flex; justify-content: space-between; align-items: baseline;
    color: #fff; margin: 0 4px 10px; font-weight: 700; letter-spacing: .04em;
  }
  .bar span { font-variant-numeric: tabular-nums; }
  .bar small { font-weight: 400; opacity: .75; }
  .screen {
    position: relative; border: 8px solid var(--shell-dark); border-radius: 12px;
    background: var(--lcd); overflow: hidden;
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px; text-align: center; color: var(--lcd-text);
    background: color-mix(in srgb, var(--lcd) 82%, transparent);
    font-weight: 700; font-size: 1.4rem;
  }
  .overlay small { font-weight: 400; font-size: .9rem; }
  .overlay[hidden] { display: none; }
  .controls {
    display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px;
  }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px;
  }
  .dpad button:nth-child(1) { grid-area: 1 / 2; }
  .dpad button:nth-child(2) { grid-area: 2 / 1; }
  .dpad button:nth-child(3) { grid-area: 2 / 3; }
  .dpad button:nth-child(4) { grid-area: 3 / 2; }
  button {
    border: 0; background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 0 var(--shell-dark); touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shell-dark); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .dpad button { border-radius: 14px; font-size: 1.4rem; }
  .actions { display: flex; flex-direction: column; gap: 14px; }
  .actions button { padding: 14px 20px; border-radius: 999px; min-width: 120px; }
  #restart { background: #e0593f; }
  @media (max-width: 360px) {
    .dpad { grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); }
    .actions button { min-width: 96px; padding: 12px 14px; }
  }
</style>
</head>
<body>
  <main class="console">
    <div class="bar">
      <div>Score <span id="score">0</span></div>
      <small>Best <span id="best">0</span></small>
    </div>

    <div class="screen">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div id="msg">Snake</div>
        <small id="sub">Press a direction to start</small>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button data-dir="up" aria-label="Up">▲</button>
        <button data-dir="left" aria-label="Left">◀</button>
        <button data-dir="right" aria-label="Right">▶</button>
        <button data-dir="down" aria-label="Down">▼</button>
      </div>
      <div class="actions">
        <button id="pause">Pause</button>
        <button id="restart">Restart</button>
      </div>
    </div>
  </main>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const N = 16, S = canvas.width / N;
  const $ = id => document.getElementById(id);
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  let snake, dir, nextDir, food, score, best = 0, timer, state = "ready"; // ready | running | paused | over

  try { best = +localStorage.getItem("snake-best") || 0; } catch (e) {}
  $("best").textContent = best;

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function reset() {
    clearTimeout(timer);
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = nextDir = DIRS.right;
    score = 0; state = "ready";
    $("score").textContent = 0;
    $("pause").textContent = "Pause";
    placeFood();
    showOverlay("Snake", "Press a direction to start");
    draw();
  }

  function showOverlay(msg, sub) {
    $("msg").textContent = msg; $("sub").textContent = sub; $("overlay").hidden = false;
  }

  function placeFood() {
    do { food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function run() {
    state = "running";
    $("overlay").hidden = true;
    loop();
  }

  function loop() {
    tick();
    if (state === "running") timer = setTimeout(loop, Math.max(70, 140 - score * 3));
  }

  function tick() {
    dir = nextDir;
    const h = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
      state = "over";
      if (score > best) {
        best = score; $("best").textContent = best;
        try { localStorage.setItem("snake-best", best); } catch (e) {}
      }
      showOverlay("Game over", "Score " + score + " · tap Restart");
      return;
    }
    snake.unshift(h);
    if (h.x === food.x && h.y === food.y) {
      score++; $("score").textContent = score; placeFood();
    } else snake.pop();
    draw();
  }

  function cell(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x * S + 1.5, y * S + 1.5, S - 3, S - 3, r);
    ctx.fill();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = css("--lcd-grid");
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) ctx.fillRect(x * S + S / 2 - 1, y * S + S / 2 - 1, 2, 2);
    ctx.fillStyle = css("--food");
    ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 4, 0, 7); ctx.fill();
    snake.forEach((s, i) => cell(s.x, s.y, i === 0 ? 9 : 6, css("--snake")));
    // eyes
    const h = snake[0], px = -dir[1], py = dir[0];
    ctx.fillStyle = css("--lcd");
    [-1, 1].forEach(k => {
      ctx.beginPath();
      ctx.arc(h.x * S + S / 2 + dir[0] * 5 + px * k * 5, h.y * S + S / 2 + dir[1] * 5 + py * k * 5, 2.5, 0, 7);
      ctx.fill();
    });
  }

  function turn(name) {
    const d = DIRS[name];
    if (state === "over" || state === "paused") return;
    if (d[0] === -dir[0] && d[1] === -dir[1] && snake.length > 1) return;
    nextDir = d;
    if (state === "ready") run();
  }

  function togglePause() {
    if (state === "running") {
      state = "paused"; clearTimeout(timer);
      $("pause").textContent = "Resume"; showOverlay("Paused", "Tap Resume to continue");
    } else if (state === "paused") {
      $("pause").textContent = "Pause"; run();
    }
  }

  document.querySelectorAll("[data-dir]").forEach(b =>
    b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.dir); }));
  $("restart").addEventListener("click", reset);
  $("pause").addEventListener("click", togglePause);

  const KEYS = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (KEYS[k]) { turn(KEYS[k]); e.preventDefault(); }
    else if (k === "p") togglePause();
    else if (k === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); state === "over" ? reset() : togglePause(); }
    else if (k === "r") reset();
  });

  let sx, sy;
  canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  canvas.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  reset();
</script>
</body>
</html>
